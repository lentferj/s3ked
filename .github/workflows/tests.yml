# Every test in this project is synthetic — fake bridges and `--demo`, never a
# MIDI port — so the whole suite runs on a hosted runner with no hardware and
# no ALSA sequencer. That is the point of running it here: the drift this
# project keeps finding by hand (stale key tables, stale "unverified" claims)
# is exactly what a red build catches on the push that introduced it.
#
# The matrix is deliberately not Linux-only. This is developed on Linux, and
# the install path is the part most likely to be broken in a way the author's
# own machine can never show them. The sibling eosed added macOS and Windows
# and the first run found a config file that had silently never persisted on
# Windows for the life of that project — a locale-codec bug invisible from a
# UTF-8 box, with nine passing tests over it.
#
# Linux sweeps every supported Python; macOS and Windows cover the ends of the
# range, which is also the wheel/no-wheel split: python-rtmidi 1.5.8 ships no
# cp313 wheel on any platform, so 3.13 exercises a from-source build.

name: tests

on:
  push:
    branches: [main, "release/**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    name: pytest (${{ matrix.os }}, ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        # DELIBERATELY `latest` rather than a pinned image. GitHub migrates
        # this label to Ubuntu 26 from 2026-10-19, and that is a change this
        # matrix exists to be told about rather than insulated from -- the
        # 3.13 job builds python-rtmidi from source there, so a toolchain or
        # libasound change shows up here and nowhere else. If a red build
        # appears around that date with no local cause, look at the runner
        # image before looking at the diff.
        os: [ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-latest
            python-version: "3.11"
          - os: macos-latest
            python-version: "3.13"
          - os: windows-latest
            python-version: "3.11"
          - os: windows-latest
            python-version: "3.13"

    steps:
      # v7 on both. checkout@v4 and setup-python@v5 target Node 20, which
      # GitHub deprecated on 2025-09-19 and now force-runs on Node 24 with
      # an annotation on every job. checkout@v5 and setup-python@v6 are
      # where Node 24 landed; v7 is taken for the longer runway. Neither
      # major touches what this workflow uses -- checkout is called with no
      # inputs at all, and setup-python only with `python-version` and
      # `cache`, both unchanged. v7 of setup-python drops the `pip-install`
      # input, which is not used here; v7 of checkout blocks fork checkout
      # for `pull_request_target` and `workflow_run`, neither of which this
      # workflow triggers on.
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # python-rtmidi is imported at module scope by `s3k.bridge`, so it has to
      # be installed even though nothing here opens a port. On Linux the ALSA
      # headers are needed whenever pip falls back to a source build, which is
      # not the rare case it sounds like: there is no cp313 wheel, so 3.13
      # builds from source every time. macOS and Windows need no equivalent —
      # CoreMIDI and WinMM are part of the OS SDK and the runners ship the
      # toolchain a source build needs.
      - name: Install ALSA headers (needed for any python-rtmidi source build)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the suite
        run: python -m pytest -q

      # Proves the console scripts are on PATH and runnable from the venv the
      # installer made — what the README's Quick Start promises, and the thing
      # that differs most between platforms (bin/ vs Scripts\).
      - name: Smoke-test the entry points
        run: |
          s3kcli --help
          s3kcli params --region program
          s3kcli groups

      # `ports` is the first command a new user runs, and until 2026-08-13 it
      # answered with a traceback on any host with no MIDI backend — a
      # container, a headless box, a runner. Both outcomes are legitimate here:
      # a runner may enumerate cleanly and return empty lists, or may have no
      # sequencer at all. What is never acceptable is a traceback, so that is
      # what this asserts rather than the exit code.
      - name: '`ports` must fail kindly, or not at all'
        shell: bash
        run: |
          set +e
          output=$(s3kcli ports 2>&1)
          status=$?
          set -e
          echo "$output"
          if printf '%s' "$output" | grep -q 'Traceback'; then
            echo "::error::s3kcli ports raised instead of exiting kindly"
            exit 1
          fi
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            echo "::error::unexpected exit status $status"
            exit 1
          fi

  # The static-analysis gate. `make check` = lint, typecheck, audit, test.
  #
  # ONE job, not the seven-platform matrix, and that is a deliberate
  # asymmetry with the job above: ruff, mypy, pip-audit, vulture, deptry and
  # detect-secrets do not have a platform or a Python-version dimension. Seven
  # copies of the same answer cost seven times as much runner time and find
  # nothing a seventh run would have found. The matrix's job is the thing that
  # genuinely varies, which is whether the package installs and the suite
  # passes; this job's is whether the source still lints.
  #
  # `make check` runs the suite too, so this job is the slow one (~8 min).
  # That is redundant with the matrix and is left in on purpose: the point of
  # a single `make check` you can run locally is that it is the same command
  # here, and splitting it into a local path and a CI path is how the two
  # drift.
  checks:
    runs-on: ubuntu-latest
    name: checks (ruff, mypy, audit)

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      # Same reason as the matrix job: python-rtmidi is imported at module
      # scope by s3k.bridge, and on Linux there is no wheel to fall back on.
      - name: Install ALSA headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev

      # `checks` rather than `dev` alone: the tools are in the `checks` extra,
      # pinned exactly, and a version that drifts from the one the baselines
      # were measured against reports a different set of findings.
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,checks]"

      # `make`, because the command CI runs and the command a developer runs
      # are then the same string. If `make` is ever absent from the runner
      # image, that is a finding about this file, not a reason to inline the
      # six tool invocations and start maintaining a second copy.
      - name: make check
        run: make check

      # Reported, not gated -- same reason as in the Makefile. Shown as an
      # annotation so the drift is visible in the PR rather than only on the
      # machine that introduced it.
      - name: Formatter status (reported, not gated)
        continue-on-error: true
        run: make format-check
